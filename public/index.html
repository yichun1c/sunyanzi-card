<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080d15">
  <meta name="description" content="YICHUN1C 数字收藏入口 — 孙燕姿 No.001 午夜典藏 3D 金箔收藏卡。">
  <title>YICHUN1C · 数字收藏</title>
  <style>
    :root{color-scheme:dark;--gold:#dfc17d;--ink:#efe2c4}
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 50% 30%,#1b2c3f 0,#0e1926 38%,#070b12 78%);color:var(--ink);font-family:"Noto Serif SC","Songti SC",Georgia,serif}
    body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 105%,#c8a24c14,transparent 60%)}
    main{width:min(92vw,560px);position:relative;z-index:1}
    .eyebrow{margin:0 0 18px;font:500 10px/1.4 "Cormorant Garamond",Georgia,serif;letter-spacing:.44em;text-transform:uppercase;color:#c5ad77}
    h1{margin:0 0 40px;font-size:clamp(30px,7vw,52px);font-weight:400;letter-spacing:.12em;line-height:1.15;color:#f0e5ce}
    h1 small{display:block;margin-top:12px;font-size:11px;letter-spacing:.3em;color:#9d8f72}
    .entry{display:block;padding:24px 26px 22px;border:1px solid #dfc17d3d;border-radius:14px;background:linear-gradient(135deg,#dfc17d10,#ffffff03 46%,#dfc17d08);text-decoration:none;color:inherit;transition:border-color .25s,transform .25s,background .25s}
    .entry:hover,.entry:focus-visible{border-color:#dfc17d9e;background:linear-gradient(135deg,#dfc17d1c,#ffffff05 46%,#dfc17d12);transform:translateY(-2px);outline:none}
    .no{display:block;font:500 10px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.34em;color:#bfa66d}
    .name{display:block;margin:14px 0 6px;font-size:21px;letter-spacing:.14em;color:#f3e9d5}
    .desc{display:block;font-size:12px;letter-spacing:.22em;color:#a89a7d}
    .arrow{display:flex;align-items:center;justify-content:space-between;margin-top:26px;padding-top:16px;border-top:1px solid #dfc17d24;font:500 10px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.3em;color:#d8c08a}
    .arrow span:last-child{font-size:14px;letter-spacing:.1em;transition:transform .25s}
    .entry:hover .arrow span:last-child{transform:translateX(4px)}
    .foot{margin:34px 0 0;font:400 10px/1.7 "Cormorant Garamond",Georgia,serif;letter-spacing:.2em;color:#6f6656}
    @media(prefers-reduced-motion:reduce){.entry,.arrow span:last-child{transition:none}}
  </style>
</head>
<body>
<main>
  <p class="eyebrow">YICHUN1C · DIGITAL ARCHIVE</p>
  <h1>数字收藏<small>COLLECTED OBJECTS · NO. 001</small></h1>
  <a class="entry" href="/sunyanzi/" aria-label="进入孙燕姿 No.001 午夜典藏 3D 金箔收藏卡">
    <span class="no">NO. 001 / 01</span>
    <span class="name">孙燕姿 · 午夜典藏</span>
    <span class="desc">3D 金箔收藏卡 · 可交互</span>
    <span class="arrow"><span>ENTER THE ARCHIVE</span><span>→</span></span>
  </a>
  <p class="foot">A SMALL ARCHIVE OF INTERACTIVE OBJECTS.</p>
</main>
</body>
</html>
